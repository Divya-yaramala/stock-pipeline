pipeline:
  schedule: "0 18 * * 1-5"   # weekdays at 6 PM UTC (market close)
  start_date: "2024-01-01"

stocks:
  tickers:
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - TSLA

aws:
  region: us-east-1
  s3_bucket: your-stock-pipeline-bucket
  s3_prefix: raw/stock_prices

snowflake:
  database: STOCK_DB
  schema: RAW
  warehouse: COMPUTE_WH
  role: SYSADMIN
  stage: S3_STAGE
  raw_table: RAW_STOCK_PRICES

dbt:
  project_dir: ./dbt
  profiles_dir: ./dbt
  target: dev
