version: 2

sources:
  - name: raw
    description: Raw stock price data ingested from yfinance via Python pipeline.
    schema: raw
    tables:
      - name: stock_prices
        description: >
          OHLCV (Open / High / Low / Close / Volume) daily stock data
          loaded from S3 Parquet files. One row per symbol per trading day.
        columns:
          - name: id
            description: Surrogate primary key.
            tests:
              - unique
              - not_null
          - name: symbol
            description: Ticker symbol (e.g. AAPL).
            tests:
              - not_null
          - name: date
            description: Trading date.
            tests:
              - not_null
          - name: close
            description: Adjusted closing price.
            tests:
              - not_null
