version: 2

models:
  - name: stg_stock_prices
    description: >
      Cleaned and deduplicated daily OHLCV stock prices.
      One row per symbol per trading day.
    columns:
      - name: symbol
        description: Ticker symbol.
        tests:
          - not_null
      - name: date
        description: Trading date.
        tests:
          - not_null
      - name: close
        description: Adjusted closing price.
        tests:
          - not_null
      - name: volume
        description: Number of shares traded.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [symbol, date]
